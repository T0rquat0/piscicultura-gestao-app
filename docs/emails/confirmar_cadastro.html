<!-- Supabase > Authentication > Emails > "Confirm signup"
     Assunto: Confirme seu e-mail para entrar no Gestão de Piscicultura -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;padding:24px;color:#13241f">
  <h2 style="margin:0 0 12px;color:#0e4f45">Confirme seu e-mail</h2>
  <p style="font-size:16px;line-height:1.5">Olá! Falta só um passo para começar a usar o <b>Gestão de Piscicultura</b>.</p>
  <p style="font-size:16px;line-height:1.5">Toque no botão abaixo para confirmar seu e-mail. Depois é só voltar ao app e entrar.</p>
  <p style="margin:24px 0">
    <a href="{{ .ConfirmationURL }}" style="background:#0e4f45;color:#ffffff;text-decoration:none;padding:14px 22px;border-radius:999px;font-weight:bold;display:inline-block">Confirmar meu e-mail</a>
  </p>
  <p style="font-size:14px;line-height:1.5;color:#4a5c56">Se você não criou uma conta, ignore este e-mail.</p>
</div>
